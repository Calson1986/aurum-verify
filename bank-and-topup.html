<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurum Verify｜多银行账本</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');:root{--bg:#0f0e0c;--panel:#1a1814;--line:#443921;--ink:#f7efdf;--muted:#a89e8b;--gold:#dcaf52;--green:#83d5a5;--orange:#e5ab56}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Noto Sans TC',sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#14120f;border-right:1px solid var(--line);padding:28px 15px;position:relative}.brand{display:block;padding:0 12px;color:var(--ink);text-decoration:none;font:700 20px 'DM Mono';letter-spacing:1px}.brand i{color:#e9c773;font-style:normal}.info{color:#887b64;border-bottom:1px solid var(--line);font:10px 'DM Mono';letter-spacing:.08em;line-height:1.9;margin:17px 12px 15px;padding-bottom:18px}.info b{color:var(--gold);font-weight:400}nav{display:grid;gap:4px}nav a{color:var(--muted);padding:11px 12px;border-radius:8px;text-decoration:none;display:flex;gap:10px;align-items:center;font-size:13px}nav a.active,nav a:hover{background:linear-gradient(90deg,#302817,#201c15);color:var(--ink)}nav em{margin-left:auto;color:var(--gold);border:1px solid #75602c;font:9px 'DM Mono';font-style:normal;padding:2px 4px;border-radius:3px}.owner{position:absolute;bottom:24px;left:25px;display:flex;gap:9px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c59a43,#765219);font:11px 'DM Mono'}.owner b,.owner small{display:block;font-size:11px}.owner small{color:var(--muted);font-size:10px}main{max-width:1600px;width:100%;margin:auto;padding:28px 38px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.crumb{font:10px 'DM Mono';color:#867760;letter-spacing:.1em;margin:0 0 7px}.crumb span{color:var(--gold)}h1{margin:0;font-size:27px;letter-spacing:-.04em}.chip{border:1px solid #695427;background:#241e13;color:#d8bb76;border-radius:20px;font:10px 'DM Mono';padding:6px 8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}.metric,.box{background:linear-gradient(145deg,#1c1914,#171510);border:1px solid var(--line);border-radius:12px}.metric{padding:17px}.metric small,.sub{font-size:11px;color:var(--muted)}.metric strong{display:block;font:700 22px 'DM Mono';margin:9px 0 5px}.up{font-size:10px;color:var(--green)}.box{padding:19px}.boxhead,.pagehead{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.box h2{margin:0 0 4px;font-size:15px}.link{color:var(--gold);font-size:11px;cursor:pointer}.row{display:grid;grid-template-columns:1.25fr .8fr .8fr .75fr .7fr;gap:8px;padding:13px 3px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}.row.head{padding-top:0;font:10px 'DM Mono';color:var(--muted)}.rec b,.rec small{display:block}.rec small{color:var(--muted);font-size:10px;margin-top:2px}.tag{width:max-content;padding:3px 7px;border-radius:20px;background:#153e2d66;color:var(--green);font-size:10px}.tag.wait{background:#4d351755;color:var(--orange)}button{font-family:inherit;cursor:pointer}.gold{border:0;border-radius:7px;background:linear-gradient(135deg,#e4bd61,#9a6e26);color:#231909;font-weight:700;font-size:11px;padding:9px 11px}.outline,.select{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:9px 10px;font:12px 'Noto Sans TC'}.notice{background:#2a2315;border:1px solid #745c2c;border-radius:8px;color:#d6c49c;padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:14px}.accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.account{padding:16px;background:#171510;border:1px solid var(--line);border-radius:10px}.account h3{margin:0 0 3px;font-size:14px}.account p{font:11px 'DM Mono';line-height:1.8;color:var(--muted)}.account footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;font-size:11px}.modal{display:none;place-items:center;position:fixed;inset:0;background:#000a;padding:16px;z-index:5}.modal.show{display:grid}.dialog{width:100%;max-width:440px;padding:22px;background:#1c1914;border:1px solid #776032;border-radius:13px;box-shadow:0 20px 70px #000}.dialog h2{margin:0 0 7px}.dialog p{font-size:12px;color:var(--muted);line-height:1.7}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}input{border:1px solid var(--line);background:#12110e;color:var(--ink);padding:9px;border-radius:6px;font:12px 'Noto Sans TC'}.actions{margin-top:17px;display:flex;justify-content:flex-end;gap:8px}#toast{position:fixed;right:22px;bottom:25px;background:#e6c26d;color:#2a1d09;padding:11px 14px;border-radius:8px;font-size:12px;transform:translateY(100px);transition:.25s;z-index:7}.mobile{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}main{padding:22px 17px 78px}.metrics{grid-template-columns:repeat(2,1fr)}.accounts{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#181510;border-top:1px solid var(--line);z-index:3;justify-content:space-around;padding:9px}.mobile a{text-decoration:none;color:var(--muted);text-align:center;font-size:17px}.mobile small{display:block;font-size:9px}.mobile .active{color:var(--gold)}}@media(max-width:520px){main{padding:20px 14px 78px}h1{font-size:22px}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:16px}.row{grid-template-columns:1.15fr .8fr .7fr}.row>*:nth-child(3),.row>*:nth-child(4){display:none}.row.head>*:nth-child(3),.row.head>*:nth-child(4){display:none}}</style></head><body><div class="app"><aside><a class="brand" href="#requests">AURUM <i>VERIFY</i></a><p class="info">MULTI-BANK LEDGER<br><b>MANUAL VERIFICATION FLOW</b></p><nav id="nav"><a class="active" href="#requests">▣ <span>上分申请</span><em id="badge">03</em></a><a href="#banks">▤ <span>银行账户</span></a><a href="#approved">↗ <span>已批准上分</span></a><a href="#ledger">▥ <span>分账户账本</span></a><a href="#audit">◷ <span>Audit Log</span></a><a href="#platforms">◈ <span>游戏平台连接</span></a></nav><div class="owner"><span class="avatar">JY</span><div><b>Jason Yeung</b><small>Operations Admin</small></div></div></aside><main><header><div><p class="crumb">AURUM VERIFY / <span id="crumb">REQUESTS</span></p><h1 id="title">待处理上分申请</h1></div><span class="chip">● 人工核账模式</span></header><div id="view"></div></main></div><nav class="mobile"><a class="active" href="#requests">▣<small>申请</small></a><a href="#banks">▤<small>银行</small></a><a href="#approved">↗<small>已批准</small></a><a href="#ledger">▥<small>账本</small></a></nav><div id="modal" class="modal"></div><div id="toast"></div><script>let banks=[{id:'b1',bank:'Ubank',holder:'Aurum Operations Pty Ltd',payid:'aurum@payid.au',bsb:'082-182',account:'1234 5678',total:3700},{id:'b2',bank:'NAB',holder:'Aurum Operations Pty Ltd',payid:'payments@aurum.au',bsb:'083-004',account:'8901 2345',total:0},{id:'b3',bank:'ANZ',holder:'Jason Yeung',payid:'0400 123 456',bsb:'012-345',account:'9876 5432',total:0}];let reqs=[{id:'REQ-24081',name:'陈伟明',platform:'Diamond Club',amount:2500,time:'10:18',status:'待核账',bank:'b1'},{id:'REQ-24080',name:'林先生',platform:'Golden Crown',amount:900,time:'10:12',status:'待核账',bank:'b1'},{id:'REQ-24079',name:'J. Wong',platform:'Eagle Win',amount:1200,time:'09:54',status:'待核账',bank:'b1'}],approved=[],logs=[];const titles={requests:'待处理上分申请',banks:'银行账户管理',approved:'已批准上分',ledger:'分账户账本',audit:'Audit Log',platforms:'游戏平台连接'};const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2});const bankOf=id=>banks.find(b=>b.id===id);const tag=s=>`<span class="tag ${s.includes('待')?'wait':''}">${s}</span>`;function table(items,buttons=false){return `<section class="box"><div class="row head"><span>申请 / 客户</span><span>游戏平台</span><span>入款账户</span><span>金额 / 时间</span><span>状态 / 操作</span></div>${items.length?items.map(r=>`<div class="row"><span class="rec"><b>${r.id} · ${r.name}</b><small>客户 ID：C-10284</small></span><span>${r.platform}</span><span>${bankOf(r.bank)?.bank||'—'}</span><span>${money(r.amount)}<br><small>${r.time}</small></span><span>${buttons?`<button class="gold" onclick="verify('${r.id}')">核账并批准</button>`:tag(r.status)}</span></div>`).join(''):`<div class="row"><span>暂无记录</span><span>—</span><span>—</span><span>—</span><span>—</span></div>`}</section>`}function requests(){let sum=reqs.reduce((n,x)=>n+x.amount,0);return `<section class="metrics"><div class="metric"><small>待核账申请</small><strong>${reqs.length}</strong><span class="up">总额 ${money(sum)}</span></div><div class="metric"><small>收款银行账户</small><strong>${banks.length}</strong><span class="up">独立账本与报表</span></div><div class="metric"><small>今日已批准</small><strong>${approved.length}</strong><span class="up">人工确认后回传平台</span></div><div class="metric"><small>平台在线</small><strong>3 / 4</strong><span class="up">可接收批准请求</span></div></section><div class="notice">每笔上分申请必须指定收款银行账户。核账时系统显示该账户的资料；批准后，金额会写入该银行账户专属账本。</div>${table(reqs,true)}`}function banksView(){return `<div class="pagehead"><div><p class="sub">每个收款账户独立管理；账号只在有权限的后台中显示。</p></div><button class="gold" onclick="addBank()">＋ 添加银行账户</button></div><section class="accounts">${banks.map(b=>`<article class="account"><h3>${b.bank}</h3><span class="tag">已启用</span><p><b>户主：</b>${b.holder}<br><b>PayID：</b>${b.payid}<br><b>BSB：</b>${b.bsb}<br><b>Account No.：</b>${b.account}</p><footer><span>已入账：<b>${money(b.total)}</b></span><a class="link" onclick="editBank('${b.id}')">编辑</a></footer></article>`).join('')}</section><section class="box" style="margin-top:14px"><div class="boxhead"><div><h2>账户分账规则</h2><span class="sub">核账批准后，金额只会写入所选银行账户账本，不会和其他账户混合。</span></div></div><div class="row head"><span>银行账户</span><span>今日入账</span><span>待核对</span><span>平台连接</span><span>状态</span></div>${banks.map(b=>`<div class="row"><span>${b.bank} · ${b.holder}</span><span>${money(b.total)}</span><span>${reqs.filter(x=>x.bank===b.id).length} 笔</span><span>全部</span><span>${tag('启用')}</span></div>`).join('')}</section>`}function approvedView(){return `<section class="box"><div class="boxhead"><div><h2>已批准上分</h2><span class="sub">平台批准请求和对应收款账户已一并记入账本</span></div></div>${table(approved)}</section>`}function ledger(){return `<div class="pagehead"><div><p class="sub">按银行账户分别查看已确认入款与对应上分记录。</p></div><select class="select" onchange="ledgerFilter=this.value;render()"><option value="all">全部银行账户</option>${banks.map(b=>`<option value="${b.id}" ${ledgerFilter===b.id?'selected':''}>${b.bank} · ${b.holder}</option>`).join('')}</select></div><section class="box"><div class="boxhead"><div><h2>${ledgerFilter==='all'?'全部账户账本':bankOf(ledgerFilter).bank+' 账本'}</h2><span class="sub">每笔都含平台申请、核账人与时间</span></div><button class="outline" onclick="toast('已按当前银行账户导出账本（演示）')">导出 CSV</button></div>${table(approved.filter(x=>ledgerFilter==='all'||x.bank===ledgerFilter))}</section>`}let ledgerFilter='all';function audit(){return `<section class="box"><div class="boxhead"><div><h2>Audit Log</h2><span class="sub">所有银行账户设置、核账与上分批准均会记录</span></div></div><div class="row head"><span>操作</span><span>对象</span><span>银行账户</span><span>时间</span><span>结果</span></div>${logs.length?logs.map(l=>`<div class="row"><span>${l.action}</span><span>${l.id}</span><span>${bankOf(l.bank)?.bank||'—'}</span><span>刚刚</span><span>${tag('成功')}</span></div>`).join(''):`<div class="row"><span>暂无操作纪录</span><span>—</span><span>—</span><span>—</span><span>—</span></div>`}</section>`}function platforms(){return `<section class="box"><div class="boxhead"><div><h2>游戏平台连接</h2><span class="sub">收到上分申请并回传批准请求</span></div></div>${['Diamond Club','Golden Crown','Eagle Win','Lucky 88'].map((p,i)=>`<div class="row"><span>${p}</span><span>${i<3?'已连接 API':'未配置'}</span><span>—</span><span>—</span><span>${tag(i<3?'已连接':'待设置')}</span></div>`).join('')}</section>`}function verify(id){let r=reqs.find(x=>x.id===id),options=banks.map(b=>`<option value="${b.id}" ${b.id===r.bank?'selected':''}>${b.bank} · ${b.holder} · ${b.payid}</option>`).join('');modal.innerHTML=`<div class="dialog"><h2>人工核账并批准</h2><p><b>${r.id} · ${r.name}</b><br>${r.platform} · ${money(r.amount)}</p><div class="field"><label>确认入款的银行账户</label><select class="select" id="bankSelect">${options}</select></div><label class="field"><span><input type="checkbox" id="paid"> 我已在银行确认该笔款项到账</span></label><label class="field"><span><input type="checkbox" id="match"> 金额、客户与申请一致</span></label><p>确认后系统将向游戏平台发送批准请求，并把这笔入款分账到所选账户。</p><div class="actions"><button class="outline" onclick="closeModal()">取消</button><button class="gold" onclick="approve('${id}')">确认并批准</button></div></div>`;modal.classList.add('show')}function approve(id){if(!paid.checked||!match.checked){toast('请先确认已到账和资料一致');return}let r=reqs.find(x=>x.id===id);r.bank=bankSelect.value;r.status='已批准';bankOf(r.bank).total+=r.amount;approved.unshift(r);logs.unshift({action:'人工确认到账并批准上分',id:r.id,bank:r.bank});reqs=reqs.filter(x=>x.id!==id);closeModal();toast('已批准上分，并分账到 '+bankOf(r.bank).bank);render()}function closeModal(){modal.classList.remove('show')}function addBank(){bankDialog()}function editBank(id){bankDialog(banks.find(x=>x.id===id))}function bankDialog(b={}){modal.innerHTML=`<div class="dialog"><h2>${b.id?'编辑':'添加'}银行账户</h2><div class="field"><label>银行名称</label><input id="fbank" value="${b.bank||''}" placeholder="例如：Ubank"></div><div class="field"><label>户主名字</label><input id="fholder" value="${b.holder||''}" placeholder="账户户主"></div><div class="field"><label>PayID</label><input id="fpayid" value="${b.payid||''}" placeholder="邮箱或手机号"></div><div class="field"><label>BSB</label><input id="fbsb" value="${b.bsb||''}" placeholder="000-000"></div><div class="field"><label>Account No.</label><input id="faccount" value="${b.account||''}" placeholder="账号"></div><div class="actions"><button class="outline" onclick="closeModal()">取消</button><button class="gold" onclick="saveBank('${b.id||''}')">保存账户</button></div></div>`;modal.classList.add('show')}function saveBank(id){let v={bank:fbank.value,holder:fholder.value,payid:fpayid.value,bsb:fbsb.value,account:faccount.value};if(!v.bank||!v.holder||!v.bsb||!v.account){toast('请填写银行、户主、BSB 和账号');return}if(id){Object.assign(banks.find(x=>x.id===id),v);logs.unshift({action:'更新银行账户资料',id:v.bank,bank:id})}else{let x={id:'b'+Date.now(),...v,total:0};banks.push(x);logs.unshift({action:'新增银行账户',id:x.bank,bank:x.id})}closeModal();toast('银行账户已保存，并会独立分账');render()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.transform='translateY(0)';setTimeout(()=>e.style.transform='translateY(100px)',2800)}function render(){let id=location.hash.slice(1)||'requests';if(!titles[id])id='requests';title.textContent=titles[id];crumb.textContent=id.toUpperCase();view.innerHTML=({requests,banks:banksView,approved:approvedView,ledger,audit,platforms})[id]();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+id));badge.textContent=reqs.length}window.verify=verify;window.approve=approve;window.closeModal=closeModal;window.addBank=addBank;window.editBank=editBank;window.saveBank=saveBank;window.toast=toast;addEventListener('hashchange',render);render();</script></body></html>
