<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurum Verify｜提款管理</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');:root{--bg:#0f0e0c;--panel:#1a1814;--line:#443921;--ink:#f7efdf;--muted:#a89e8b;--gold:#dcaf52;--green:#83d5a5;--orange:#e5ab56;--red:#e4816c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Noto Sans TC',sans-serif}.wrap{max-width:1320px;margin:auto;padding:28px 38px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.back{font:11px 'DM Mono';color:var(--gold);text-decoration:none}.crumb{font:10px 'DM Mono';letter-spacing:.1em;color:#867760;margin:0 0 7px}.crumb b{color:var(--gold)}h1{margin:0;font-size:27px;letter-spacing:-.04em}.chip{border:1px solid #695427;background:#241e13;color:#d8bb76;border-radius:20px;font:10px 'DM Mono';padding:6px 8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}.metric,.box{background:linear-gradient(145deg,#1c1914,#171510);border:1px solid var(--line);border-radius:12px}.metric{padding:17px}.metric small,.sub{font-size:11px;color:var(--muted)}.metric strong{display:block;font:700 22px 'DM Mono';margin:9px 0 5px}.up{font-size:10px;color:var(--green)}.box{padding:19px}.boxhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.box h2{font-size:15px;margin:0 0 4px}.row{display:grid;grid-template-columns:1.2fr .85fr .85fr .75fr .75fr;gap:8px;align-items:center;padding:13px 3px;border-bottom:1px solid var(--line);font-size:12px}.row.head{padding-top:0;color:var(--muted);font:10px 'DM Mono'}.rec b,.rec small{display:block}.rec small{font-size:10px;color:var(--muted);margin-top:2px}.tag{width:max-content;border-radius:20px;padding:3px 7px;background:#153e2d66;color:var(--green);font-size:10px}.tag.wait{background:#4d351755;color:var(--orange)}button{font-family:inherit;cursor:pointer}.gold{border:0;border-radius:7px;background:linear-gradient(135deg,#e4bd61,#9a6e26);color:#231909;font-weight:700;font-size:11px;padding:9px 11px}.outline,.select{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:9px 10px;font:12px 'Noto Sans TC'}.notice{background:#2a2315;border:1px solid #745c2c;border-radius:8px;color:#d6c49c;padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:14px}.modal{display:none;place-items:center;position:fixed;inset:0;background:#000a;padding:16px;z-index:5}.modal.show{display:grid}.dialog{width:100%;max-width:440px;padding:22px;background:#1c1914;border:1px solid #776032;border-radius:13px}.dialog h2{margin:0 0 7px}.dialog p{font-size:12px;color:var(--muted);line-height:1.7}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}.actions{margin-top:17px;display:flex;justify-content:flex-end;gap:8px}#toast{position:fixed;right:22px;bottom:25px;background:#e6c26d;color:#2a1d09;padding:11px 14px;border-radius:8px;font-size:12px;transform:translateY(100px);transition:.25s;z-index:7}@media(max-width:650px){.wrap{padding:20px 14px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric strong{font-size:16px}.row{grid-template-columns:1.1fr .8fr .75fr}.row>*:nth-child(3),.row>*:nth-child(4){display:none}.row.head>*:nth-child(3),.row.head>*:nth-child(4){display:none}}</style></head><body><main class="wrap"><header><div><a class="back" href="index.html">← 返回资金管理工作台</a><p class="crumb">AURUM VERIFY / <b>WITHDRAWALS</b></p><h1>提款与出款记账</h1></div><span class="chip">● 人工出款确认</span></header><section class="metrics"><div class="metric"><small>待处理提款</small><strong id="pending">03</strong><span class="up">人工确认后才出款</span></div><div class="metric"><small>待出款金额</small><strong id="pendingAmt">$4,650</strong><span class="up">来自 3 个游戏平台</span></div><div class="metric"><small>今日已出款</small><strong id="paidCount">0</strong><span class="up">独立银行账户账本</span></div><div class="metric"><small>出款银行账户</small><strong>3</strong><span class="up">可按账户分账</span></div></section><div class="notice">提款申请从游戏平台同步后，必须人工确认客户资料与实际银行付款。确认后系统会回传游戏平台“已出款”状态，并将金额记为对应银行账户的出款。</div><section id="table" class="box"></section><section class="box" style="margin-top:14px"><div class="boxhead"><div><h2>出款账本</h2><span class="sub">仅显示已确认付款的记录；可按银行账户独立导出。</span></div><select class="select" onchange="filter=this.value;render()"><option value="all">全部银行账户</option><option value="Ubank">Ubank</option><option value="NAB">NAB</option><option value="ANZ">ANZ</option></select></div><div id="ledger"></div></section></main><div id="modal" class="modal"></div><div id="toast"></div><script>let withdrawals=[{id:'WD-1802',name:'陈小姐',platform:'Diamond Club',amount:1800,time:'10:25',bank:'Ubank',status:'待出款'},{id:'WD-1801',name:'林先生',platform:'Golden Crown',amount:950,time:'10:13',bank:'NAB',status:'待出款'},{id:'WD-1800',name:'J. Wong',platform:'Eagle Win',amount:1900,time:'09:48',bank:'Ubank',status:'待出款'}],paid=[],filter='all';const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});const tag=s=>`<span class="tag ${s.includes('待')?'wait':''}">${s}</span>`;function row(r,button){return `<div class="row"><span class="rec"><b>${r.id} · ${r.name}</b><small>客户提款申请</small></span><span>${r.platform}</span><span>${r.bank}</span><span>${money(r.amount)}<br><small>${r.time}</small></span><span>${button?`<button class="gold" onclick="openPay('${r.id}')">确认已出款</button>`:tag(r.status)}</span></div>`}function render(){pending.textContent=withdrawals.length;pendingAmt.textContent=money(withdrawals.reduce((n,x)=>n+x.amount,0));paidCount.textContent=paid.length;table.innerHTML=`<div class="boxhead"><div><h2>待处理提款申请</h2><span class="sub">选择实际付款的银行账户后，确认出款。</span></div></div><div class="row head"><span>申请 / 客户</span><span>游戏平台</span><span>付款账户</span><span>金额 / 时间</span><span>状态 / 操作</span></div>${withdrawals.length?withdrawals.map(x=>row(x,true)).join(''):'<div class="row"><span>暂无待出款申请</span><span>—</span><span>—</span><span>—</span><span>—</span></div>'}`;let show=paid.filter(x=>filter==='all'||x.bank===filter);ledger.innerHTML=`<div class="row head"><span>申请 / 客户</span><span>游戏平台</span><span>付款账户</span><span>金额 / 时间</span><span>状态</span></div>${show.length?show.map(x=>row(x,false)).join(''):'<div class="row"><span>暂无已出款纪录</span><span>—</span><span>—</span><span>—</span><span>—</span></div>'}`}function openPay(id){let r=withdrawals.find(x=>x.id===id);modal.innerHTML=`<div class="dialog"><h2>确认提款已付款</h2><p><b>${r.id} · ${r.name}</b><br>${r.platform} · ${money(r.amount)}</p><div class="field"><label>实际付款的银行账户</label><select class="select" id="bank"><option ${r.bank==='Ubank'?'selected':''}>Ubank</option><option ${r.bank==='NAB'?'selected':''}>NAB</option><option ${r.bank==='ANZ'?'selected':''}>ANZ</option></select></div><label class="field"><span><input id="sent" type="checkbox"> 我已在银行完成实际付款</span></label><label class="field"><span><input id="detail" type="checkbox"> 收款资料和提款金额均正确</span></label><p>确认后，系统会记录这笔出款、回传游戏平台状态，并写入所选银行账户的出款账本。</p><div class="actions"><button class="outline" onclick="closeM()">取消</button><button class="gold" onclick="confirmPay('${id}')">确认已出款</button></div></div>`;modal.classList.add('show')}function confirmPay(id){if(!sent.checked||!detail.checked){toast('请先确认实际付款和资料正确');return}let r=withdrawals.find(x=>x.id===id);r.bank=bank.value;r.status='已出款';paid.unshift(r);withdrawals=withdrawals.filter(x=>x.id!==id);closeM();toast('已回传平台并写入 '+r.bank+' 出款账本');render()}function closeM(){modal.classList.remove('show')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.transform='translateY(0)';setTimeout(()=>e.style.transform='translateY(100px)',2800)}window.openPay=openPay;window.confirmPay=confirmPay;window.closeM=closeM;render();</script></body></html>
